# ============================================================
# SecureAssess Teacher Desktop — electron-builder config
# ============================================================

appId: com.proctify.teacher
productName: Proctify Teacher
copyright: "Copyright © 2024 Proctify"

# Security: apply @electron/fuses after packing
afterPack: ./afterPack.js

# Directories
directories:
  buildResources: assets
  output: release

# Files to pack
files:
  - dist/**/*
  - "!dist/renderer/**/*.map"
  # App / window icon (BrowserWindow reads app.asar/assets/icon.png)
  - assets/icon.png

# Extra resources bundled at the root of the app
extraResources:
  # Bundled PyInstaller CCTV binary — built by CI before electron-builder runs
  - from: "../../dist-pyinstaller/cctv-vision"
    to: cctv-vision
    filter:
      - "**/*"

  # ── Embedded API server (zero terminal required) ───────────
  # dist/bundle.cjs is produced by apps/server/scripts/build-bundle.mjs.
  # It runs with process.execPath + ELECTRON_RUN_AS_NODE=1, so it needs its
  # external dependencies next to it in resources/server/node_modules.
  - from: "../server/dist/bundle.cjs"
    to: server/bundle.cjs
  - from: "../server/dist/bundle.cjs.map"
    to: server/bundle.cjs.map
  - from: "../server/prisma/schema.prisma"
    to: server/prisma/schema.prisma
  - from: "../../node_modules/@prisma/client"
    to: server/node_modules/@prisma/client
  - from: "../../node_modules/.prisma/client"
    to: server/node_modules/.prisma/client
  - from: "../../node_modules/pdf-parse"
    to: server/node_modules/pdf-parse
  - from: "../../node_modules/node-ensure"
    to: server/node_modules/node-ensure
  # Prisma engines for the target platform
  - from: "../../node_modules/@prisma/engines"
    to: prisma-engines
    filter:
      - "**/*.node"
      - "**/*.so*"
      - "**/*.dll"

# Native addons and Prisma artefacts cannot be read from inside app.asar —
# they are unpacked next to it and resolved through app.asar.unpacked.
asarUnpack:
  - "**/*.node"
  - "**/node_modules/.prisma/**"
  - "**/node_modules/@prisma/**"

# ── GitHub Releases (teacher desktop) ─────────────────────────
# Dedicated channel: this app reads teacher.yml / teacher-linux.yml, the kiosk
# reads student.yml / student-linux.yml. Sharing `latest.yml` made the two apps
# overwrite each other's update manifest on the same release.
publish:
  - provider: github
    owner: VenkataSai-cruzer
    repo: Proctify
    releaseType: release
    channel: teacher

# Windows
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  # No spaces: GitHub sanitizes spaces in uploaded asset names, which left
  # teacher.yml pointing at a filename that did not exist on the release.
  artifactName: "Proctify-Teacher-Setup-${version}.${ext}"
  verifyUpdateCodeSignature: false
  signAndEditExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Proctify Teacher

# Linux
linux:
  executableName: proctify-teacher
  artifactName: "proctify-teacher-${version}-${arch}.${ext}"
  target:
    - AppImage
    - deb
  icon: build/icon.png
  category: Education
  maintainer: "Proctify <admin@secureassess.local>"
  synopsis: Secure Examination & Proctoring Platform — Teacher Console

deb:
  packageName: proctify-teacher
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1

# macOS (optional future target)
mac:
  target:
    - dmg
  category: public.app-category.education
  icon: assets/icon.icns
