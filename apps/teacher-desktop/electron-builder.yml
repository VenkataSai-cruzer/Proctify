# ============================================================
# SecureAssess Teacher Desktop — electron-builder config
# ============================================================

appId: com.secureassess.teacher
productName: SecureAssess Teacher
copyright: "Copyright © 2024 SecureAssess"

# Security: apply @electron/fuses after packing
afterPack: ./afterPack.js

# Directories
directories:
  buildResources: assets
  output: release

# Files to pack
files:
  - dist/**/*
  - "!dist/renderer/**/*.map"

# Extra resources bundled at the root of the app
extraResources:
  # Bundled PyInstaller CCTV binary — built by CI before electron-builder runs
  - from: "../../dist-pyinstaller/cctv-vision"
    to: cctv-vision
    filter:
      - "**/*"
  # Prisma engines for the target platform
  - from: "../../node_modules/@prisma/engines"
    to: prisma-engines
    filter:
      - "**/*.node"
      - "**/*.so*"
      - "**/*.dll"

# Native addons and Prisma artefacts cannot be read from inside app.asar —
# they are unpacked next to it and resolved through app.asar.unpacked.
asarUnpack:
  - "**/*.node"
  - "**/node_modules/.prisma/**"
  - "**/node_modules/@prisma/**"

# ── GitHub Releases (teacher desktop) ─────────────────────────
# electron-updater fetches latest.yml from the GitHub release page.
# The in-app auto-updater in src/main/autoUpdater.ts will fall back
# to the LAN server (/updates) if the GitHub URL is overridden in settings.
publish:
  - provider: github
    owner: VenkataSai-cruzer
    repo: Proctify
    releaseType: release

# Windows
win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.png
  # No spaces: GitHub sanitizes spaces in uploaded asset names, which left
  # latest.yml pointing at a filename that did not exist on the release.
  artifactName: "SecureAssess-Teacher-Setup-${version}.${ext}"
  verifyUpdateCodeSignature: false
  signAndEditExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SecureAssess Teacher

# Linux
linux:
  executableName: secureassess-teacher
  artifactName: "secureassess-teacher-${version}-${arch}.${ext}"
  target:
    - AppImage
    - deb
  icon: assets/icon.png
  category: Education
  maintainer: "SecureAssess <admin@secureassess.local>"
  synopsis: Secure Examination & Proctoring Platform — Teacher Console

deb:
  packageName: secureassess-teacher
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1

# macOS (optional future target)
mac:
  target:
    - dmg
  category: public.app-category.education
  icon: assets/icon.icns
