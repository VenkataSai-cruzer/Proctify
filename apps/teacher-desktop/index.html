<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Packaged builds load this file over file://, so this meta policy (not
         the main-process header policy) governs the renderer. connect-src must
         cover the embedded server (127.0.0.1) AND arbitrary LAN lab hosts
         (machine names, not just IPs) — otherwise every API call is blocked. -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' http: https: ws: wss:;" />
    <title>Proctify — Teacher Console</title>
  </head>
  <body class="bg-[#0B1120] text-white antialiased">
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
