# ============================================================
# SecureAssess Student Kiosk — electron-builder config
# ============================================================

appId: com.secureassess.student
productName: SecureAssess Student Kiosk
copyright: "Copyright © 2024 SecureAssess"

# Security: apply @electron/fuses after packing
afterPack: ./afterPack.js

directories:
  buildResources: assets
  output: release

files:
  - dist/**/*
  - "!dist/renderer/**/*.map"

# ── LAN update server (student kiosk stays on local network) ──
# The kiosk checks the lab server for updates, not GitHub,
# because lab PCs may have no internet access during exams.
publish:
  - provider: generic
    url: http://secureassess-lab.local:3000/updates/student
    useMultipleRangeRequest: false

win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.png
  verifyUpdateCodeSignature: false
  signAndEditExecutable: false

nsis:
  oneClick: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: SecureAssess Kiosk

linux:
  executableName: secureassess-student-kiosk
  artifactName: "secureassess-student-kiosk-${version}-${arch}.${ext}"
  target:
    - AppImage
    - deb
  icon: assets/icon.png
  category: Education

deb:
  packageName: secureassess-student-kiosk
  depends:
    - libgtk-3-0
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
