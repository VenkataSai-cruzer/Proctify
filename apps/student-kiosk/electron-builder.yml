# ============================================================
# SecureAssess Student Kiosk — electron-builder config
# ============================================================

appId: com.proctify.student
productName: Proctify Student Kiosk
copyright: "Copyright © 2024 Proctify"

# Security: apply @electron/fuses after packing
afterPack: ./afterPack.js

directories:
  buildResources: assets
  output: release

files:
  - dist/**/*
  - "!dist/renderer/**/*.map"
  # App / window icon (BrowserWindow reads app.asar/assets/icon.png)
  - assets/icon.png

# Native addons and Prisma artefacts cannot be read from inside app.asar —
# they are unpacked next to it and resolved through app.asar.unpacked.
asarUnpack:
  - "**/*.node"
  - "**/node_modules/.prisma/**"
  - "**/node_modules/@prisma/**"

# ── GitHub Releases (student kiosk) ───────────────────────────
# Dedicated channel: this app reads student.yml / student-linux.yml while the
# teacher console uses teacher*.yml, so neither overwrites the other's manifest.
publish:
  - provider: github
    owner: VenkataSai-cruzer
    repo: Proctify
    releaseType: release
    channel: student

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  # No spaces: GitHub sanitizes spaces in uploaded asset names, so the
  # default "<productName> Setup <version>.exe" became a dotted filename.
  artifactName: "Proctify-Student-Kiosk-Setup-${version}.${ext}"
  verifyUpdateCodeSignature: false
  signAndEditExecutable: false

nsis:
  oneClick: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: Proctify Student Kiosk

linux:
  executableName: proctify-student-kiosk
  artifactName: "proctify-student-kiosk-${version}-${arch}.${ext}"
  target:
    - AppImage
    - deb
  icon: build/icon.png
  category: Education

deb:
  packageName: proctify-student-kiosk
  depends:
    - libgtk-3-0
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
