# ============================================================
# Proctify — Automated Cross-Platform Release Pipeline
# ============================================================
#
# Build-then-publish model:
#   build-cctv-linux — PyInstaller CCTV bundle, archived as .tar.gz
#   build-windows    — Windows .exe installers (never publishes)
#   build-linux      — Linux .AppImage + .deb installers (never publishes)
#   publish          — single atomic GitHub Release upload
#
# electron-builder is always run with --publish never so the
# platform jobs never race each other on the GitHub Release.
# ============================================================

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"

jobs:
  # ── Job 1: Build PyInstaller CCTV bundle (Linux) ──────────────
  build-cctv-linux:
    name: Build CCTV Vision Bundle (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "services/cctv-vision/requirements.txt"

      - name: Install Linux OpenCV dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Build Linux CCTV PyInstaller bundle
        run: bash services/cctv-vision/build_bundle.sh

      - name: Archive CCTV bundle (tar.gz preserves +x permissions)
        run: |
          # build_bundle.sh writes straight to the canonical repo-root path,
          # which is exactly where electron-builder's extraResources looks.
          test -x dist-pyinstaller/cctv-vision/cctv-vision
          tar -czf cctv-vision-linux.tar.gz -C dist-pyinstaller cctv-vision
          tar -tzf cctv-vision-linux.tar.gz | head -n 5

      - uses: actions/upload-artifact@v4
        with:
          name: cctv-vision-linux-archive
          path: cctv-vision-linux.tar.gz
          retention-days: 1

  # ── Job 2: Windows installers (.exe) ─────────────────────────
  build-windows:
    name: Windows Installer (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack (Yarn Berry)
        run: corepack enable

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "services/cctv-vision/requirements.txt"

      - name: Build Windows CCTV PyInstaller bundle
        shell: pwsh
        run: .\services\cctv-vision\build_bundle.ps1

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build shared package
        run: yarn workspace @secureassess/shared build

      - name: Generate Prisma client
        run: yarn workspace @secureassess/server db:generate

      - name: Typecheck all workspaces
        run: yarn typecheck

      - name: Build app bundles (esbuild main/preload + vite renderer)
        run: |
          yarn workspace @secureassess/teacher-desktop build:main
          yarn workspace @secureassess/student-kiosk   build:main
          yarn workspace @secureassess/teacher-desktop vite build
          yarn workspace @secureassess/student-kiosk   vite build

      - name: Package Teacher Desktop (Windows - no publish)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ELECTRON_OVERRIDE_DIST_PATH: ${{ github.workspace }}/node_modules/electron/dist
        run: yarn workspace @secureassess/teacher-desktop electron-builder --config electron-builder.yml --win --publish never

      - name: Package Student Kiosk (Windows - no publish)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ELECTRON_OVERRIDE_DIST_PATH: ${{ github.workspace }}/node_modules/electron/dist
        run: yarn workspace @secureassess/student-kiosk electron-builder --config electron-builder.yml --win --publish never

      - name: Verify CCTV bundle packaged in the teacher installer
        shell: pwsh
        run: |
          $exe = "apps\teacher-desktop\release\win-unpacked\resources\cctv-vision\cctv-vision.exe"
          if (-not (Test-Path $exe)) { throw "CCTV bundle missing from packaged app: $exe" }
          Write-Host "OK: $exe = $((Get-Item $exe).Length) bytes"

      - name: Smoke test packaged binaries
        shell: pwsh
        run: |
          $targets = @(
            "apps\teacher-desktop\release\win-unpacked\Proctify Teacher.exe",
            "apps\student-kiosk\release\win-unpacked\Proctify Student Kiosk.exe"
          )
          foreach ($exe in $targets) {
            if (-not (Test-Path $exe)) { throw "Missing unpacked binary: $exe" }
            Write-Host "== $exe --smoke-test"
            $proc = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -Wait -PassThru
            Write-Host "== exit code: $($proc.ExitCode)"
            if ($proc.ExitCode -ne 0) { throw "Smoke test failed for $exe (exit $($proc.ExitCode))" }
          }

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          # Each app publishes its own channel manifest (teacher.yml /
          # student.yml), so both must be uploaded.
          path: |
            apps/teacher-desktop/release/*.exe
            apps/teacher-desktop/release/*.exe.blockmap
            apps/teacher-desktop/release/*.yml
            apps/student-kiosk/release/*.exe
            apps/student-kiosk/release/*.exe.blockmap
            apps/student-kiosk/release/*.yml
          if-no-files-found: error
          retention-days: 1

  # ── Job 3: Linux installers (.AppImage + .deb) ───────────────
  build-linux:
    name: Linux Installers (.AppImage + .deb)
    needs: build-cctv-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack (Yarn Berry)
        run: corepack enable

      - name: Install Linux packaging libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 rpm libfuse2 \
            libgtk-3-dev libnss3 libxss1 libxtst6 fakeroot dpkg xvfb

      - uses: actions/download-artifact@v4
        with:
          name: cctv-vision-linux-archive

      - name: Extract CCTV bundle with executable permissions intact
        run: |
          # electron-builder.yml (teacher-desktop) reads
          # ../../dist-pyinstaller/cctv-vision relative to apps/teacher-desktop,
          # i.e. the repo root.
          mkdir -p dist-pyinstaller
          tar -xzf cctv-vision-linux.tar.gz -C dist-pyinstaller
          chmod +x dist-pyinstaller/cctv-vision/cctv-vision
          test -x dist-pyinstaller/cctv-vision/cctv-vision

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build shared package
        run: yarn workspace @secureassess/shared build

      - name: Generate Prisma client
        run: yarn workspace @secureassess/server db:generate

      - name: Typecheck all workspaces
        run: yarn typecheck

      - name: Build app bundles (esbuild main/preload + vite renderer)
        run: |
          yarn workspace @secureassess/teacher-desktop build:main
          yarn workspace @secureassess/student-kiosk   build:main
          yarn workspace @secureassess/teacher-desktop vite build
          yarn workspace @secureassess/student-kiosk   vite build

      - name: Package Teacher Desktop (Linux - no publish)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: yarn workspace @secureassess/teacher-desktop electron-builder --config electron-builder.yml --linux --publish never

      - name: Package Student Kiosk (Linux - no publish)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: yarn workspace @secureassess/student-kiosk electron-builder --config electron-builder.yml --linux --publish never

      - name: Smoke test packaged binaries (headless)
        env:
          CI: "true"
          ELECTRON_DISABLE_SANDBOX: "1"
        run: |
          for bin in \
            apps/teacher-desktop/release/linux-unpacked/proctify-teacher \
            apps/student-kiosk/release/linux-unpacked/proctify-student-kiosk; do
            if [ ! -x "$bin" ]; then
              echo "::error::missing unpacked binary $bin"
              ls -la "$(dirname "$bin")" || true
              exit 1
            fi
            echo "== $bin --smoke-test"
            xvfb-run -a "$bin" --smoke-test
            echo "== passed: $bin"
          done

      - name: Upload Linux installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          # Channel manifests: teacher-linux.yml / student-linux.yml
          path: |
            apps/teacher-desktop/release/*.AppImage
            apps/teacher-desktop/release/*.deb
            apps/teacher-desktop/release/*.yml
            apps/student-kiosk/release/*.AppImage
            apps/student-kiosk/release/*.deb
            apps/student-kiosk/release/*.yml
          if-no-files-found: error
          retention-days: 1

  # ── Job 4: Publish GitHub Release ─────────────────────────────
  publish:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows & Linux installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub Release & upload final installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Proctify ${{ github.ref_name }}"
          generate_release_notes: true
          overwrite_files: true
          # upload-artifact roots artifacts at the least common ancestor of the
          # uploaded paths (apps/), so files land one level deeper than the
          # artifact name. Match recursively, and fail loudly if a glob misses
          # instead of silently publishing an asset-less release.
          fail_on_unmatched_files: true
          files: |
            release-assets/windows-installers/**/*.exe
            release-assets/windows-installers/**/*.exe.blockmap
            release-assets/windows-installers/**/*.yml
            release-assets/linux-installers/**/*.AppImage
            release-assets/linux-installers/**/*.deb
            release-assets/linux-installers/**/*.yml
